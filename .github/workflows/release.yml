name: Release

# Push a tag like v2.0.0 to build the Windows (.exe) installer,
# publish them on GitHub Releases and update latest.json for the in-app updater.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          # Linux builds are disabled until tested; re-enable with: - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libdbus-1-dev libclang-dev cmake build-essential

      - name: Windows build tools (Ninja + libclang for whisper.cpp)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          choco install ninja -y --no-progress
          "LIBCLANG_PATH=C:/Program Files/LLVM/bin" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: FlowVoice v__VERSION__
          releaseBody: "Veja as novidades no [CHANGELOG](https://github.com/cesarkali/Flow-Voice/blob/main/CHANGELOG.md)."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

      # The website and the 1.x updater download "FlowVoiceSetup.exe" from the latest release:
      # publish the Windows installer under that stable name too.
      - name: Stable installer name (FlowVoiceSetup.exe)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter "*-setup.exe" | Select-Object -First 1
          Copy-Item $exe.FullName FlowVoiceSetup.exe
          gh release upload "v$version" FlowVoiceSetup.exe --clobber
