[package]
name = "flowvoice"
version = "2.2.0"
description = "FlowVoice — ditado por voz com IA"
authors = ["Júlio Caliberda (cesarkali)"]
license = "GPL-3.0-only"
repository = "https://github.com/cesarkali/Flow-Voice"
edition = "2021"
rust-version = "1.80"

[lib]
name = "flowvoice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
whisper-rs = "0.16"
cpal = "0.15"
hound = "3.5"
arboard = "3"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
base64 = "0.22"
regex = "1"
parking_lot = "0.12"
anyhow = "1"
log = { version = "0.4", features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
futures-util = "0.3"
once_cell = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_System_DataExchange",
  "Win32_Security",
  "Win32_Graphics_Gdi",
  "Win32_System_Registry",
  "Win32_System_Power",
  "Win32_System_LibraryLoader",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Composition",
  "Win32_Graphics_Dwm",
  "Foundation",
  "Foundation_Numerics",
  "System",
  "UI",
  "UI_Composition",
  "UI_Composition_Desktop",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# Not "abort": a bug in one dictation job must end with an error card (pipeline::guarded), not
# take the whole app down.
panic = "unwind"
strip = true

# whisper.cpp must be compiled for speed, not size (the cmake build inherits this level).
[profile.release.package.whisper-rs-sys]
opt-level = 3

[profile.dev.package.whisper-rs-sys]
opt-level = 3
